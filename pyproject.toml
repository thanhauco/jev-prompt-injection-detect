[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-pi-detect"
version = "0.1.0"
description = "Prompt injection detection using TypeSafe's Jev (System One) model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.7,<0.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-pi-detect = "jev_pi_detect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_pi_detect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
